[package]
name = "razorpdf-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core Rust engine for razorpdf: geometry, triage, VLM fallback, output"
keywords = ["pdf", "parser", "rag", "layout-analysis", "mcp"]
categories = ["parser-implementations"]

[lib]
name = "razorpdf_core"
path = "src/lib.rs"

[features]
default = []
pdfium = ["dep:pdfium-render"]
# Accurate tiktoken counting (downloads BPE ranks on first use; falls back
# to the heuristic offline).
accurate-tokens = ["dep:tiktoken-rs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
unicode-normalization = "0.1"
tracing.workspace = true
tokio.workspace = true
rayon.workspace = true
rstar.workspace = true
lopdf.workspace = true
image.workspace = true
reqwest.workspace = true
base64.workspace = true
tiktoken-rs = { workspace = true, optional = true }
flate2 = "1"
pdfium-render = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
criterion = "0.5"

[[bench]]
name = "throughput"
harness = false
