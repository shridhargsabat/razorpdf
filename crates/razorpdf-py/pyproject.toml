[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "razorpdf"
version = "0.3.1"
description = "Hybrid local-first PDF parser: deterministic Rust geometry + selective sub-page VLM. Markdown + grounded RAG chunks."
readme = { file = "../../README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
keywords = ["pdf", "pdf-parsing", "table-extraction", "rag", "mcp", "layout-analysis"]
authors = [{ name = "razorpdf contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shridhargsabat/razorpdf"
Repository = "https://github.com/shridhargsabat/razorpdf"
Issues = "https://github.com/shridhargsabat/razorpdf/issues"
Changelog = "https://github.com/shridhargsabat/razorpdf/releases"

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
manifest-path = "Cargo.toml"
module-name = "razorpdf.razorpdf"
python-source = "python"
