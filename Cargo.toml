[workspace]
members = [
    "crates/razorpdf-core",
    "crates/razorpdf",
    "crates/razorpdf-py",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["razorpdf contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/shridhargsabat/razorpdf"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
rayon = "1.10"
rstar = "0.12"
lopdf = "0.42"
image = { version = "0.25", features = ["webp", "png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
tiktoken-rs = "0.6"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
blake3 = "1.5"
lru = "0.19"

[profile.release]
lto = "thin"
codegen-units = 16
