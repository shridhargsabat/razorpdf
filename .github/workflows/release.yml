name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: tag matches package version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check versions
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CARGO_VER=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          PY_VER=$(grep '^version = ' crates/razorpdf-py/pyproject.toml | head -1 | cut -d'"' -f2)
          echo "tag=$TAG cargo=$CARGO_VER pyproject=$PY_VER"
          [ "v$CARGO_VER" = "$TAG" ] || { echo "tag does not match Cargo version"; exit 1; }
          [ "v$PY_VER" = "$TAG" ] || { echo "tag does not match pyproject version"; exit 1; }

  cli:
    name: cli (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            optional: false
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            optional: false
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            optional: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            optional: false
    continue-on-error: ${{ matrix.optional }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --target ${{ matrix.target }} -p razorpdf
      - name: package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          cd "target/${TARGET}/release"
          if [ "$ARCHIVE" = "zip" ]; then
            7z a "razorpdf-${TAG}-${TARGET}.zip" razorpdf.exe
            mv ./*.zip "$GITHUB_WORKSPACE/"
          else
            tar czf "razorpdf-${TAG}-${TARGET}.tar.gz" razorpdf
            mv ./*.tar.gz "$GITHUB_WORKSPACE/"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: razorpdf-*

  wheels:
    name: wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One abi3 wheel per platform covers CPython 3.10+.
          # aarch64 builds natively on an ARM runner (no cross toolchain).
          # Linux wheels build inside manylinux_2_28 containers (glibc 2.28+:
          # RHEL8+/Debian10+/Ubuntu20.04+) -- host-built wheels came out as
          # manylinux_2_39 and were uninstallable on older distros.
          # NOTE: setup-python is IGNORED inside the containers, so Linux
          # entries select the container interpreter explicitly (3.10+ is
          # required for abi3-py310); the aarch64 entry overrides the
          # action's default CROSS image with the official native image
          # (no QEMU on the ARM runner).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
            interp: python3.10
            optional: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
            interp: python3.10
            optional: false
          - os: macos-latest
            target: aarch64-apple-darwin
            interp: python
            optional: false
          - os: macos-latest
            target: x86_64-apple-darwin
            interp: python
            optional: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            interp: python
            optional: false
    continue-on-error: ${{ matrix.optional }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: patchelf (manylinux repair)
        if: runner.os == 'Linux'
        run: pip install patchelf
      - name: build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: latest
          command: build
          # manylinux/container are ignored on non-Linux (empty there).
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
          args: --release -m crates/razorpdf-py/Cargo.toml -o dist -i ${{ matrix.interp }} --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  publish:
    name: publish release
    needs: [preflight, cli, wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Only release payloads: the docker job also uploads a *.dockerbuild
          # build record that must not be pulled into the release.
          pattern: '{cli-*,wheels-*}'
          merge-multiple: true
      - name: list assets
        shell: bash
        run: ls -la artifacts/
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # All `${{ }}` interpolations below are static matrix values or trusted
  # GitHub contexts (ref_name via env); no untrusted issue/PR input anywhere.
  pypi:
    name: publish PyPI
    needs: [preflight, wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  docker:
    name: push GHCR image
    # Runs on tags AND manual dispatch (dispatch pushes a :main tag for testing).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

