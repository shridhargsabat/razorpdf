name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: tag matches package version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check versions
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CARGO_VER=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          PY_VER=$(grep '^version = ' crates/razorpdf-py/pyproject.toml | head -1 | cut -d'"' -f2)
          echo "tag=$TAG cargo=$CARGO_VER pyproject=$PY_VER"
          [ "v$CARGO_VER" = "$TAG" ] || { echo "tag does not match Cargo version"; exit 1; }
          [ "v$PY_VER" = "$TAG" ] || { echo "tag does not match pyproject version"; exit 1; }

  cli:
    name: cli (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            optional: false
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            optional: false
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            optional: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            optional: false
    continue-on-error: ${{ matrix.optional }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --target ${{ matrix.target }} -p razorpdf
      - name: package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          cd "target/${TARGET}/release"
          if [ "$ARCHIVE" = "zip" ]; then
            7z a "razorpdf-cli-${TAG}-${TARGET}.zip" razorpdf.exe
            mv ./*.zip "$GITHUB_WORKSPACE/"
          else
            tar czf "razorpdf-cli-${TAG}-${TARGET}.tar.gz" razorpdf
            mv ./*.tar.gz "$GITHUB_WORKSPACE/"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: razorpdf-cli-*

  wheels:
    name: wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One abi3 wheel per platform covers CPython 3.10+.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: maturin
            optional: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: zigbuild
            optional: true
          - os: macos-latest
            target: aarch64-apple-darwin
            build: maturin
            optional: false
          - os: macos-latest
            target: x86_64-apple-darwin
            build: maturin
            optional: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: maturin
            optional: false
    continue-on-error: ${{ matrix.optional }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: patchelf (manylinux repair)
        if: runner.os == 'Linux' && matrix.build == 'maturin'
        run: pip install patchelf
      - name: zig toolchain (aarch64 cross)
        if: matrix.build == 'zigbuild'
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
      - name: build wheels (native)
        if: matrix.build == 'maturin'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: latest
          command: build
          args: --release -m crates/razorpdf-py/Cargo.toml -o dist -i python --target ${{ matrix.target }}
      - name: build wheels (zigbuild cross)
        if: matrix.build == 'zigbuild'
        shell: bash
        run: |
          pip install maturin
          maturin build --release --zigbuild --target ${{ matrix.target }} \
            -i python -m crates/razorpdf-py/Cargo.toml -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  publish:
    name: publish release
    needs: [preflight, cli, wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: list assets
        shell: bash
        run: ls -la artifacts/
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # All `${{ }}` interpolations below are static matrix values or trusted
  # GitHub contexts (ref_name via env); no untrusted issue/PR input anywhere.
  pypi:
    name: publish PyPI
    needs: [preflight, wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    name: publish crates.io
    needs: [preflight]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish razorpdf-core
        run: cargo publish -p razorpdf-core
      - name: publish razorpdf (CLI)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            cargo publish -p razorpdf && break
            echo "retry $i in 60s (waiting for core to index)..."
            sleep 60
          done
