name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: cli (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --target ${{ matrix.target }} -p razorpdf-cli
      - name: package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          cd "target/${TARGET}/release"
          if [ "$ARCHIVE" = "zip" ]; then
            7z a "razorpdf-cli-${TAG}-${TARGET}.zip" razorpdf.exe
            mv ./*.zip "$GITHUB_WORKSPACE/"
          else
            tar czf "razorpdf-cli-${TAG}-${TARGET}.tar.gz" razorpdf
            mv ./*.tar.gz "$GITHUB_WORKSPACE/"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: razorpdf-cli-*

  wheels:
    name: wheel (${{ matrix.os }} py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: patchelf (manylinux repair)
        if: runner.os == 'Linux'
        run: pip install patchelf
      - name: build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: latest
          command: build
          # One interpreter per job (setup-python's); `python` resolves on every OS.
          args: --release -m crates/razorpdf-py/Cargo.toml -o dist -i python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl

  publish:
    name: publish release
    needs: [cli, wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: list assets
        shell: bash
        run: ls -la artifacts/
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
