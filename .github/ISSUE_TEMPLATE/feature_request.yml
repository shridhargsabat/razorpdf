name: Feature request
description: Propose an enhancement for razorpdf
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? What document or workflow motivates this?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? Include CLI flags, API shape, or output format if relevant.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI (parse/inspect/bench)
        - Python API
        - MCP server
        - Geometry / layout
        - Tables
        - VLM fallback
        - RAG chunks / grounding
        - Packaging / Docker / CI
        - Docs / demo
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried.
  - type: checkboxes
    id: fit
    attributes:
      label: Fit with project direction
      description: See CONTRIBUTING.md ground rules.
      options:
        - label: This keeps the fast path pure-geometry (no whole-page model calls)
        - label: I am willing to contribute this (code, tests, or sample PDFs)
